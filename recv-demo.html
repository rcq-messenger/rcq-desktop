<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RCQ web-chat — receive via the REAL app service</title>
    <style>
      body { font: 13px ui-monospace, monospace; background: #0b0b0c; color: #e7e7e7; padding: 20px; }
      .col { max-width: 560px; background: #151517; border: 1px solid #26262b; border-radius: 12px; padding: 12px; }
      .col h2 { font-size: 11px; color: #8a8a93; text-transform: uppercase; letter-spacing: .15em; margin: 0 0 8px; }

      .bubble .meta { font-size: 10px; color: #8a8a93; }
      .pass { color: #36d399; } .fail { color: #f87272; } #log div { margin: 2px 0; } #log .step { color: #6ea8fe; }
      #done { font-size: 15px; margin-top: 12px; }
    </style>
  </head>
  <body>
    <h1 style="font-size:14px">RCQ web-chat receive — exercising the REAL app service (signal-device.ts + incoming-store) against live backend :8000</h1>
    <div class="col"><h2>Account A — received</h2><div id="inbox"></div></div>
    <div id="log" style="margin-top:12px"></div>
    <div id="done"></div>
    <script type="module" src="/src/recv-demo.ts"></script>
  </body>
</html>
