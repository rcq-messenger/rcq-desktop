[package]
name = "app"
version = "0.3.21"
description = "RCQ desktop client"
authors = ["RCQ"]
license = "AGPL-3.0"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Circumvention on macOS. wry reaches the webview proxy through
# nw_proxy_config_create_socksv5, a Network.framework symbol introduced in
# macOS 14 and linked NON-weakly (verified: `nm -m` shows it as plain
# "undefined external"). A build with this on therefore refuses to launch on
# macOS 13 and older even for someone who never turns the bypass on.
#
# It used to be off by default, which meant every released Mac build reported
# the toggle as unsupported and refused to switch on — on ANY macOS, including
# 26. The founder hit exactly that: a dead checkbox under a line blaming an OS
# version that was years newer than required.
#
# Now on by default, with the bundle's minimumSystemVersion raised to 14.0 to
# match (tauri.conf.json). The floor is what makes this safe: without it the
# updater would hand a build that cannot launch to someone on 13.
default = ["mac-bypass"]
mac-bypass = ["tauri/macos-proxy"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"

# Calls: WebKitGTK keeps the media stream behind a setting and denies any
# permission request nobody answers, so the Linux build reaches into its own
# webview to switch both on. Pinned to the exact version wry resolves, so there
# is one copy of the crate and the handle Tauri hands us is the type we expect.
[target."cfg(target_os = \"linux\")".dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
# Already in the tree through tauri; named here because `open_external` parses
# a URL the page handed it and must reject anything that is not http/https.
url = "2"
base64 = "0.22"
ed25519-dalek = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "socks"] }
# The PIN vault (src/vault.rs): Argon2id over the PIN, AES-256-GCM over the
# account material. Both are the reference Rust implementations; nothing here
# is hand-rolled.
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
