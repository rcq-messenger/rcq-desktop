<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RCQ web-chat — v=2 send/receive demo</title>
    <style>
      body { font: 14px ui-monospace, monospace; background: #0b0b0c; color: #e7e7e7; padding: 20px; }
      h1 { font-size: 15px; font-weight: 600; }
      .row { display: flex; gap: 16px; margin-top: 12px; }
      .col { flex: 1; background: #151517; border: 1px solid #26262b; border-radius: 12px; padding: 12px; }
      .col h2 { font-size: 12px; color: #8a8a93; text-transform: uppercase; letter-spacing: .15em; margin: 0 0 8px; }
      .bubble { background: #232329; border-radius: 10px; padding: 7px 10px; margin: 6px 0; }
      .bubble.in { background: #1b3a2b; }
      .bubble .meta { font-size: 10px; color: #8a8a93; }
      .pass { color: #36d399; } .fail { color: #f87272; }
      #checks div { margin: 2px 0; }
      #done { font-size: 16px; margin-top: 14px; }
    </style>
  </head>
  <body>
    <h1>RCQ web-chat v=2 (Double Ratchet via libsignal-WASM) — two devices exchange + decrypt, in-browser</h1>
    <div class="row">
      <div class="col"><h2>Alice (UIN 1000) inbox</h2><div id="alice"></div></div>
      <div class="col"><h2>Bob (UIN 2000) inbox</h2><div id="bob"></div></div>
    </div>
    <div id="checks" style="margin-top:14px"></div>
    <div id="done"></div>
    <script type="module" src="/src/v2demo.ts"></script>
  </body>
</html>
